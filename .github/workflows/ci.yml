name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/phone-otp/index.ts
        # Keep the admin endpoint type-checked with the OTP function.
      - name: Type-check admin account Edge Function
        run: deno check --no-lock supabase/functions/admin-account/index.ts
      - name: Test OTP security primitives
        run: deno test --no-lock supabase/functions/phone-otp/otp_test.ts
      - name: Test account and OTP database migrations
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/account_security.test.sql
