name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/phone-otp/index.ts
